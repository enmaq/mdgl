[package]
name = "mdgl"
version = "0.3.1"
edition = "2021"
rust-version = "1.74"
description = "MDGL 0.1 parser, checker, evaluator, terminal-cell renderer and terminal player."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enmaq/mdgl"
homepage = "https://github.com/enmaq/mdgl"
keywords = ["mdgl", "markdown", "animation", "terminal"]
include = ["src/**", "examples/**", "scripts/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "LICENSE-UNISEG", "Cargo.toml"]

[[bin]]
name = "mdgl"
path = "src/bin/mdgl.rs"

[[bin]]
name = "mdgl-adapter"
path = "src/bin/mdgl-adapter.rs"

[lib]
name = "mdgl"
path = "src/lib.rs"

[dependencies]
# Pinned: UNICODE_VERSION (15, 0, 0) in tables.rs, the reference profile of Go uniseg v0.4.7. MIT OR Apache-2.0.
unicode-segmentation = "=1.10.1"

[dev-dependencies]
serde_json = "=1.0.140"
