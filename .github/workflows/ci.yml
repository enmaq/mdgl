name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: vet
        run: go vet ./...
      - name: test (includes the conformance suite)
        run: go test ./... -count=1
      - name: conformance only
        run: go test . -run Conformance -count=1 -v
      - name: build the CLI
        run: go build -o /tmp/mdgl ./cmd/mdgl && /tmp/mdgl check ../examples/cubes.mdgl
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - name: short parser fuzz
        run: go test ./parse -run '^$' -fuzz FuzzParse -fuzztime 30s
  packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: single-version check
        run: sh check-version.sh
      - name: license files present
        run: for d in rust ts python c; do test -s $d/LICENSE-MIT && test -s $d/LICENSE-APACHE && cmp LICENSE-MIT $d/LICENSE-MIT && cmp LICENSE-APACHE $d/LICENSE-APACHE; done
      - name: ts tests
        run: cd ts && npm ci && npm test
      - name: rust tests
        run: cd rust && cargo test --quiet
      - name: c tests
        run: cmake -S c -B c/build && cmake --build c/build && ./c/build/mdgl_check_test
      - name: python tests
        run: cd python && python -m unittest discover -s tests -q
      - name: example smoke (go)
        shell: bash
        run: |
          set -eo pipefail
          out=$(cd go && go run ./examples/render -t 4)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '[^[:space:]]'
      - name: player smoke (go)
        shell: bash
        run: |
          set -eo pipefail
          tmp=$(mktemp -d)
          (cd go && go build -o "$tmp/mdgl" ./cmd/mdgl)
          python3 scripts/player-smoke.py --name go --int-code 0 -- "$tmp/mdgl"
      - name: example smoke (rust)
        shell: bash
        run: |
          set -eo pipefail
          out=$(cd rust && cargo run -q --example render -- --at 4)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '[^[:space:]]'
      - name: player smoke (rust)
        shell: bash
        run: |
          set -eo pipefail
          (cd rust && cargo build -q --bin mdgl)
          python3 scripts/player-smoke.py --name rust -- rust/target/debug/mdgl
      - name: example smoke (c)
        shell: bash
        run: |
          set -eo pipefail
          cmake -S c -B c/build
          cmake --build c/build --target mdgl_render
          out=$(cd c && ./build/mdgl_render --time 4)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '[^[:space:]]'
      - name: player smoke (c)
        shell: bash
        run: |
          set -eo pipefail
          cmake --build c/build --target mdgl_cli
          python3 scripts/player-smoke.py --name c -- c/build/mdgl
      - name: example smoke (js)
        shell: bash
        run: |
          set -eo pipefail
          out=$(cd ts && npm run --silent example:js -- --time 4)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '[^[:space:]]'
      - name: player smoke (js)
        shell: bash
        run: |
          set -eo pipefail
          python3 scripts/player-smoke.py --name js -- node ts/bin/mdgl.js
      - name: example smoke (typescript)
        shell: bash
        run: |
          set -eo pipefail
          out=$(cd ts && npm run --silent example:ts -- --time 4)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '[^[:space:]]'
      - name: example smoke (python)
        shell: bash
        run: |
          set -eo pipefail
          out=$(cd python && PYTHONPATH=. python examples/render.py --time 4)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '[^[:space:]]'
      - name: player smoke (python)
        shell: bash
        run: |
          set -eo pipefail
          python3 scripts/player-smoke.py --name python -- env PYTHONPATH=python python3 -m mdgl
  example-media-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: install ffmpeg, DejaVu font and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core cmake
          python3 -m pip install "Pillow==10.2.0"
      - name: build five adapters, compare every frame, export media
        run: >
          python3 scripts/example-media.py export
          --out "${{ runner.temp }}/example-media/out"
          --failure-report "${{ runner.temp }}/example-media/failure-{scene}.json"
      - name: upload media and manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: example-media
          path: ${{ runner.temp }}/example-media/out
          if-no-files-found: error
      - name: upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-media-failure
          path: ${{ runner.temp }}/example-media/failure-*.json
          if-no-files-found: ignore
