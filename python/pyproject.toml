[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mdgl"
version = "0.3.0"
description = "MarkdownGL checker; the development tree also has a parser, evaluator, terminal renderer and protocol adapter (unreleased, not independently validated)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "LICENSE-UNISEG.txt"]
keywords = ["mdgl", "markdown", "animation", "terminal"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]

[project.scripts]
mdgl = "mdgl.cli:run"

[project.urls]
Homepage = "https://github.com/enmaq/mdgl"
Repository = "https://github.com/enmaq/mdgl"
Specification = "https://github.com/enmaq/mdgl/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["mdgl"]

[tool.hatch.build.targets.sdist]
include = ["mdgl/**/*.py", "tests/*.py", "examples/*.py", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "LICENSE-UNISEG.txt", "pyproject.toml"]
